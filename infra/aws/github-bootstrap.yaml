AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One-time bootstrap so GitHub Actions can deploy the RenewBrick website
  without stored AWS keys: GitHub OIDC trust, a deploy role for the workflow,
  a CloudFormation execution role that builds the site stack, and (optionally)
  the Route 53 hosted zone. Deploy once, in us-east-1, as an account admin.
  See docs/DEPLOY_AWS.md.

Parameters:
  GitHubRepository:
    Type: String
    AllowedPattern: "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"
    Description: GitHub repository allowed to deploy, as owner/name (e.g. benny/renewbrick).
  GitHubOwnerId:
    Type: String
    Default: ""
    AllowedPattern: "[0-9]*"
    Description: >-
      Numeric ID of the repository owner. Set it (with GitHubRepositoryId) when
      GitHub's OIDC subject includes IDs, e.g.
      repo:owner@123/name@456:environment:production. Blank = names-only subject.
  GitHubRepositoryId:
    Type: String
    Default: ""
    AllowedPattern: "[0-9]*"
    Description: Numeric ID of the repository (see GitHubOwnerId).
  GitHubEnvironment:
    Type: String
    Default: production
    Description: >-
      GitHub environment the deploy job uses. Only jobs in this environment can
      assume the role; restrict the environment to the main branch in GitHub.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      "false" if this AWS account already has the token.actions.githubusercontent.com
      identity provider (an account can only have one).
  SiteStackName:
    Type: String
    Default: renewbrick-site
    AllowedPattern: "[a-z][a-z0-9-]*"
    Description: Name of the website stack the workflow manages (lowercase; also prefixes the bucket name).
  DomainName:
    Type: String
    Default: renewbrick.com
  CreateHostedZone:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      "true" to host DNS for DomainName in Route 53 (recommended; then set the
      four output nameservers at GoDaddy). "false" to keep DNS at GoDaddy.

Conditions:
  MakeOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]
  MakeHostedZone: !Equals [!Ref CreateHostedZone, "true"]
  SubjectHasIds: !Not [!Equals [!Ref GitHubRepositoryId, ""]]

Rules:
  RegionIsUsEast1:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: Deploy this stack in us-east-1, alongside the website stack.
  IdsComeInPairs:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref GitHubOwnerId, ""]
            - !Equals [!Ref GitHubRepositoryId, ""]
          - !And
            - !Not [!Equals [!Ref GitHubOwnerId, ""]]
            - !Not [!Equals [!Ref GitHubRepositoryId, ""]]
        AssertDescription: Set both GitHubOwnerId and GitHubRepositoryId, or neither.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  HostedZone:
    Type: AWS::Route53::HostedZone
    Condition: MakeHostedZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: RenewBrick website DNS (nameservers set at GoDaddy)

  # Used only by CloudFormation to create/update/delete the website stack.
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W3037] # apigateway:TagResource/UntagResource are real but unlisted
    Properties:
      Description: CloudFormation builds the RenewBrick website stack with this role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: website-stack-resources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SiteBucket
                Effect: Allow
                Action: "s3:*"
                Resource:
                  - !Sub "arn:aws:s3:::${SiteStackName}-*"
                  - !Sub "arn:aws:s3:::${SiteStackName}-*/*"
              - Sid: CloudFront
                Effect: Allow
                Action: "cloudfront:*"
                Resource: "*"
              - Sid: Certificate
                Effect: Allow
                Action:
                  - acm:RequestCertificate
                  - acm:DescribeCertificate
                  - acm:DeleteCertificate
                  - acm:AddTagsToCertificate
                  - acm:ListTagsForCertificate
                  - acm:RemoveTagsFromCertificate
                Resource: "*"
              - Sid: Dns
                Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                  - route53:ChangeResourceRecordSets
                  - route53:GetChange
                Resource:
                  - "arn:aws:route53:::hostedzone/*"
                  - "arn:aws:route53:::change/*"
              - Sid: DeployPolicyOnly
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:DeletePolicy
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicyVersion
                  - iam:TagPolicy
                  - iam:UntagPolicy
                  - iam:ListPolicyTags
                  - iam:ListEntitiesForPolicy
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:policy/${SiteStackName}-*"
              # --- Contact form: Lambda + API Gateway + SES + logs ---
              - Sid: ContactFunctionRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${SiteStackName}-*"
              - Sid: ContactFunctionRoleLogsPolicyOnly
                Effect: Allow
                Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${SiteStackName}-*"
                Condition:
                  ArnEquals:
                    iam:PolicyARN: arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
              - Sid: PassRoleToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${SiteStackName}-*"
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: ContactFunction
                Effect: Allow
                Action: "lambda:*"
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${SiteStackName}-*"
              - Sid: ContactApi
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                  # Needed to apply the stack tags; cfn-lint doesn't list these actions yet (W3037).
                  - apigateway:TagResource
                  - apigateway:UntagResource
                Resource:
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/apis"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/apis/*"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/tags/*"
              - Sid: ContactEmail
                Effect: Allow
                Action:
                  - ses:CreateEmailIdentity
                  - ses:DeleteEmailIdentity
                  - ses:GetEmailIdentity
                  - ses:PutEmailIdentityDkimAttributes
                  - ses:PutEmailIdentityDkimSigningAttributes
                  - ses:PutEmailIdentityFeedbackAttributes
                  - ses:PutEmailIdentityMailFromAttributes
                  - ses:PutEmailIdentityConfigurationSetAttributes
                  - ses:TagResource
                  - ses:UntagResource
                  - ses:ListTagsForResource
                Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
              - Sid: ContactEmailList
                Effect: Allow
                Action: ses:ListEmailIdentities
                Resource: "*"
              - Sid: ContactLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:TagLogGroup
                  - logs:ListTagsForResource
                  - logs:ListTagsLogGroup
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${SiteStackName}-*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${SiteStackName}-*:*"
              - Sid: ContactLogsDescribe
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"

  # Assumed by the GitHub Actions deploy job via OIDC — no stored keys.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GitHub Actions deploys the RenewBrick website with this role
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Pinning the IDs also stops a re-created repo with the same name from deploying.
                token.actions.githubusercontent.com:sub: !If
                  - SubjectHasIds
                  - !Sub
                    - "repo:${Owner}@${GitHubOwnerId}/${Name}@${GitHubRepositoryId}:environment:${GitHubEnvironment}"
                    - Owner: !Select [0, !Split ["/", !Ref GitHubRepository]]
                      Name: !Select [1, !Split ["/", !Ref GitHubRepository]]
                  - !Sub "repo:${GitHubRepository}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: deploy-website
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageWebsiteStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${SiteStackName}/*"
              - Sid: ReadTemplates
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: HandOverToCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: UploadSite
                Effect: Allow
                Action: [s3:ListBucket, s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub "arn:aws:s3:::${SiteStackName}-*"
                  - !Sub "arn:aws:s3:::${SiteStackName}-*/*"
              - Sid: RefreshCache
                Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"
              - Sid: WhoAmI
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: "*"

Outputs:
  DeployRoleArn:
    Description: Set as GitHub variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationExecutionRoleArn:
    Description: Set as GitHub variable AWS_CFN_EXECUTION_ROLE_ARN
    Value: !GetAtt CloudFormationExecutionRole.Arn
  HostedZoneId:
    Condition: MakeHostedZone
    Description: Set as GitHub variable ROUTE53_HOSTED_ZONE_ID
    Value: !Ref HostedZone
  NameServers:
    Condition: MakeHostedZone
    Description: Enter these four nameservers for the domain at GoDaddy
    Value: !Join [", ", !GetAtt HostedZone.NameServers]
