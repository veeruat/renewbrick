AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  RenewBrick static website: private S3 bucket served through CloudFront with
  HTTPS (ACM), clean-URL rewriting, canonical-host redirects and security
  headers. Deploy in us-east-1 (CloudFront certificates must live there).
  See docs/DEPLOY_AWS.md.

Parameters:
  DomainName:
    Type: String
    Default: renewbrick.com
    Description: Bare domain. Both it and www.<domain> are served.
  PrimaryHost:
    Type: String
    Default: apex
    AllowedValues: [apex, www]
    Description: >-
      Canonical hostname; the other one 301-redirects to it. Use "apex" with
      Route 53. If DNS stays at GoDaddy, use "www" (GoDaddy cannot point the
      bare domain at CloudFront).
  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Route 53 hosted zone ID for DomainName. When set, certificate validation
      and DNS records are created automatically. Leave empty if DNS stays at
      GoDaddy (add the records there by hand — see docs/DEPLOY_AWS.md).

Conditions:
  UseRoute53: !Not [!Equals [!Ref HostedZoneId, ""]]
  ApexIsPrimary: !Equals [!Ref PrimaryHost, apex]

Rules:
  RegionIsUsEast1:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: Deploy this stack in us-east-1 (CloudFront only accepts ACM certificates from us-east-1).

Resources:
  # --- Storage -----------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Versioning gives a rollback path; old versions expire after 30 days.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # --- CloudFront --------------------------------------------------------
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: CloudFront-only access to the RenewBrick bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "www.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - UseRoute53
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
          - DomainName: !Sub "www.${DomainName}"
            HostedZoneId: !Ref HostedZoneId
        - !Ref AWS::NoValue

  # Viewer-request function. Kept dependency-free (CloudFront JS 2.0 runtime).
  # tests/unit/cloudfront-function.test.ts extracts and exercises this code.
  UrlFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-url"
      AutoPublish: true
      FunctionConfig:
        Comment: Canonical host and trailing-slash redirects; clean URLs to .html files
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          var PRIMARY = "${Primary}";

          function serialize(querystring) {
            var parts = [];
            for (var key in querystring) {
              var item = querystring[key];
              var values = item.multiValue ? item.multiValue : [item];
              for (var i = 0; i < values.length; i++) {
                parts.push(values[i].value === "" ? key : key + "=" + values[i].value);
              }
            }
            return parts.length ? "?" + parts.join("&") : "";
          }

          function redirect(location) {
            return {
              statusCode: 301,
              statusDescription: "Moved Permanently",
              headers: { location: { value: location } }
            };
          }

          function handler(event) {
            var request = event.request;
            var host = request.headers.host ? request.headers.host.value : PRIMARY;
            var uri = request.uri;
            var search = serialize(request.querystring);

            if (host !== PRIMARY) {
              return redirect("https://" + PRIMARY + uri + search);
            }
            if (uri.length > 1 && uri.charAt(uri.length - 1) === "/") {
              return redirect(uri.replace(/\/+$/, "") + search);
            }
            var last = uri.substring(uri.lastIndexOf("/") + 1);
            if (uri === "/") {
              request.uri = "/index.html";
            } else if (uri !== "/opengraph-image" && !/\.[A-Za-z0-9]+$/.test(last)) {
              request.uri = uri + ".html";
            }
            return request;
          }
        - Primary: !If [ApexIsPrimary, !Ref DomainName, !Sub "www.${DomainName}"]

  # Mirrors out/_headers (generated by scripts/postbuild.mjs).
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security"
        Comment: Security headers for the RenewBrick website
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=(), payment=()"
              Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: RenewBrick website
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        IPV6Enabled: true
        # PriceClass_200 includes edge locations in India (PriceClass_100 does not).
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # AWS managed "CachingOptimized": honours the Cache-Control set at upload.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlFunction.FunctionMetadata.FunctionARN
        # A private bucket answers 403 for missing keys; serve the 404 page for both.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  # --- DNS (only when DNS is hosted in Route 53) ---------------------------
  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: UseRoute53
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          # Z2FDTNDATAQYW2 is the fixed hosted zone ID for every CloudFront distribution.
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Sub "www.${DomainName}"
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Sub "www.${DomainName}"
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

  # --- Least-privilege deploy permissions -----------------------------------
  # Attach to the IAM user/role that runs scripts/deploy-aws.sh.
  DeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Upload the RenewBrick site and invalidate its CloudFront cache
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadStackOutputs
            Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Ref AWS::StackId
          - Sid: ListBucket
            Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt SiteBucket.Arn
          - Sid: WriteObjects
            Effect: Allow
            Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
            Resource: !Sub "${SiteBucket.Arn}/*"
          - Sid: InvalidateCache
            Effect: Allow
            Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
            Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  SiteUrl:
    Description: Canonical site URL (use as SITE_URL when building)
    Value: !If [ApexIsPrimary, !Sub "https://${DomainName}", !Sub "https://www.${DomainName}"]
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Point DNS here (CNAME for www when DNS stays at GoDaddy)
    Value: !GetAtt Distribution.DomainName
  CertificateArn:
    Value: !Ref Certificate
  DeployPolicyArn:
    Description: Attach this policy to the IAM identity that runs deploys
    Value: !Ref DeployPolicy
