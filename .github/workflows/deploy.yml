# Tests every push and pull request. Pushes to main (and manual runs on main)
# then create/update the AWS infrastructure — S3 bucket, CloudFront, HTTPS
# certificate, DNS records — and publish the static site.
#
# One-time setup (AWS bootstrap stack + GitHub variables): docs/DEPLOY_AWS.md.
# No AWS keys are stored in GitHub; the deploy job signs in through OIDC.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      index:
        description: "Launch: allow search engines to index the site"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  AWS_REGION: us-east-1
  SITE_STACK_NAME: renewbrick-site
  SITE_DOMAIN: renewbrick.com

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Keep Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to AWS
    needs: test
    # Deploys only from main: pushes to main, or a manual run started on main.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # A first run waits for the HTTPS certificate and the CloudFront rollout.
    timeout-minutes: 90
    environment:
      name: production
      url: ${{ steps.publish.outputs.site_url }}
    permissions:
      contents: read
      id-token: write # OIDC sign-in to AWS
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Check repository variables
        env:
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          CFN_ROLE: ${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}
        run: |
          missing=()
          [[ -n "$DEPLOY_ROLE" ]] || missing+=(AWS_DEPLOY_ROLE_ARN)
          [[ -n "$CFN_ROLE" ]] || missing+=(AWS_CFN_EXECUTION_ROLE_ARN)
          if (( ${#missing[@]} )); then
            echo "::error::Missing GitHub variables: ${missing[*]}. See docs/DEPLOY_AWS.md (one-time setup)."
            exit 1
          fi

      - name: Sign in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: renewbrick-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create or update S3, CloudFront, certificate and DNS
        env:
          CFN_ROLE: ${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}
          PRIMARY_HOST: ${{ vars.SITE_PRIMARY_HOST || 'apex' }}
          HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
        run: |
          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name "$SITE_STACK_NAME" \
            --template-file infra/aws/renewbrick-site.yaml \
            --role-arn "$CFN_ROLE" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              DomainName="$SITE_DOMAIN" \
              PrimaryHost="$PRIMARY_HOST" \
              HostedZoneId="$HOSTED_ZONE_ID" \
            --tags Project=renewbrick ManagedBy=github-actions

      - name: Build and publish the site
        id: publish
        env:
          STACK_NAME: ${{ env.SITE_STACK_NAME }}
          # Search indexing only for a launch: manual run with "index" ticked,
          # or once the repository variable SITE_INDEXING is set to "true".
          INDEX: ${{ inputs.index == true || vars.SITE_INDEXING == 'true' }}
        run: |
          flags=()
          [[ "$INDEX" == "true" ]] && flags+=(--index)
          scripts/deploy-aws.sh "${flags[@]}"
          site_url="$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" --output text)"
          echo "site_url=$site_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Published ${site_url}"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Search indexing: ${INDEX}"
          } >> "$GITHUB_STEP_SUMMARY"
