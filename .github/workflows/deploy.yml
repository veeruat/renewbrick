# The only workflow, and it runs only for a push to main that came from a merged pull request
# (or a manual run on main). Nothing runs on branch pushes or open pull requests.
#
# One job: build the static site and the enquiry form image (pushed to GHCR as :<commit>), then
# send the site and this commit's deploy/server files to the shared server over SSH. There,
# deploy/server/ci-deploy.sh switches to the new release atomically, starts the form service,
# checks both through the edge, and goes back to the previous release if that fails.
# The CI key can run nothing else (forced command, deploy/server/ci-launcher.sh).
#
# Search indexing stays off unless the repository variable SITE_INDEXING is "true" (see
# docs/LAUNCH_CHECKLIST.md), or a manual run has "index" ticked.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      index:
        description: "Launch: allow search engines to index the site"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  SITE_URL: https://renewbrick.com
  CONTACT_IMAGE: ghcr.io/veeruat/renewbrick-contact

jobs:
  deploy:
    name: Deploy to server
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Only merged pull requests deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')"
          if [ "${prs:-0}" -eq 0 ]; then
            echo "::error::$GITHUB_SHA reached main without a merged pull request - not deploying."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build the site
        env:
          SITE_INDEXING: ${{ (inputs.index == true || vars.SITE_INDEXING == 'true') && 'true' || 'false' }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          bash deploy/server/nginx-headers.sh out
          tag="$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          [ "$SITE_INDEXING" = "true" ] && tag="$tag-indexed"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Built $tag (indexing $SITE_INDEXING)"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the enquiry form image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/server/contact/Dockerfile
          push: true
          tags: ${{ env.CONTACT_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=contact
          cache-to: type=gha,scope=contact,mode=max

      - name: SSH key and pinned host key
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" || { echo "LIGHTSAIL_SSH_KEY / LIGHTSAIL_KNOWN_HOSTS secrets are missing (deploy/server/README.md)"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Go live on the server (${{ env.RELEASE_TAG }})
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ubuntu
        run: |
          case "$HOST" in *" "*|"") echo "::error::LIGHTSAIL_HOST must be just the IP/hostname"; exit 1;; esac
          mkdir -p bundle && mv out bundle/site && cp -r --parents deploy/server bundle/
          tar -C bundle -czf - . | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "$USER_NAME@$HOST" "deploy $GITHUB_SHA $RELEASE_TAG"

      - name: Public check
        run: |
          for i in $(seq 1 12); do
            curl -fsS -o /dev/null https://renewbrick.com/ && exit 0
            sleep 5
          done
          echo "renewbrick.com not OK after deploy"; exit 1

      - if: always()
        run: rm -f ~/.ssh/deploy_key
